<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="top-nav">            
        <a href="../index.html#/dashboard" class="menu-btn-link">
            <button class="menu-btn" id="home-btn" title="Settings">⚙️</button>
        </a>
        
        <div class="stats-weather-container">
            <div class="glass-widget stats-widget">
                <span class="icon">🕒</span>
                <div class="stats-text">
                    <p>Focused Today:</p>
                    <p class="stats-val">0m</p>
                </div>
                <div class="location-box">
                    <p class="region">Chandigarh</p>
                </div>
            </div>
            
            <div class="glass-widget weather-widget">
                <div class="weather-main">
                    <span class="sun-icon">☀️</span>
                    <span class="temp">12°</span>
                </div>
                <p class="weather-desc">Clear</p>
                <p class="windspeed">H: 24° | L: 10°</p>
            </div>
        </div>
    </nav>

    <main class="center-content">
        <h1 class="clock">15:50</h1>
        <h2 class="greeting">Good afternoon, Guest.</h2>
        <p class="quote">Small focus today creates big results tomorrow.</p>

        <div class="glass-widget task-card">
            <h3>Today Task</h3>
            <p class="task-prompt">Write your main goal here</p>
            <input type="text" class="task-input" placeholder="">
        </div>

        <button class="focus-btn">
            <a href="../focusmode/index.html">Focus Mode</a>
        </button>
    </main>

    <footer class="bottom-nav">
        <div class="todo-dropdown glass-widget" id="todoTrigger">
            <input type="checkbox" id="todo-check">
            <label for="todo-check">To-Do</label>
            <span class="arrow">▲</span>

            <div class="todo-panel" id="todoPanel">
                <div class="panel-header">
                    <div class="handle"></div> <h4>My Tasks</h4>
                </div>
                
                <div class="todo-list-content" id="todoList">
                    </div>

                <div class="todo-input-wrapper">
                    <input type="text" id="todoInput" placeholder="Add a task..." maxlength="50">
                </div>
            </div>
        </div>
    </footer>

    <script src="focus.js"></script>
    <script src="weather.js"></script>
</body>
</html>
