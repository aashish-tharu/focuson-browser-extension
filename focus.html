<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Dashboard</title>
    <link rel="stylesheet" href="./CSS_files/focus.css">
</head>
<body>
    
    <nav class="top-nav">
        <button class="menu-btn">☰</button>
        <div class="nav-content">
            <ul>
                <li>
                    <img src="" alt="">
                    <a href="">Home</a>
                </li>
                <li>
                    <img src="" alt="">
                    <a href="">Summary</a>
                </li>
                <li>
                    <img src="" alt="">
                    <a href="">Change Name</a>
                </li>
                <li>
                    <img src="" alt="">
                    <a href="">Digital Wellbeing</a>
                </li>
            </ul>
        </div>
        <div class="stats-weather-container">
            <div class="glass-widget stats-widget">
                <span class="icon">🕒</span>
                <div class="stats-text">
                    <p>Focused Today:</p>
                    <p class="stats-val">0m</p>
                </div>
                <div class="location-box">
                    <p class="city">Om</p>
                    <p class="region">Chandigarh</p>
                </div>
            </div>
            
            <div class="glass-widget weather-widget">
                <div class="weather-main">
                    <span class="sun-icon">☀️</span>
                    <span class="temp">12°</span>
                </div>
                <p class="weather-desc">Clear</p>
                <p class="windspeed">H: 24° | L: 10°</p>
            </div>
        </div>
    </nav>

    <main class="center-content">
        <h1 class="clock">15:50</h1>
        <h2 class="greeting">Good afternoon, Guest.</h2>
        <p class="quote">Small focus today creates big results tomorrow.</p>

        <div class="glass-widget task-card">
            <h3>Today Task</h3>
            <p class="task-prompt">Write your main goal here</p>
            <input type="text" class="task-input" placeholder="">
        </div>

        <button class="focus-btn">Focus Mode</button>
    </main>

    <footer class="bottom-nav">
        <div class="todo-dropdown glass-widget">
            <input type="checkbox" id="todo-check">
            <label for="todo-check">To-Do</label>
            <span class="arrow">▼</span>
        </div>
    </footer>

    <script src = "./JS_files/focus.js"></script>
    <script src = "./JS_files/weather.js"></script>

</body>
</html>
