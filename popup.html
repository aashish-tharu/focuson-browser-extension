<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YT Bookmarks</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="main-body">
        <div class="website-Customize" id = "customizeBox">
            <h1>Website Customize</h1>

            <div class="content">
                
                <hr>
                <div class="mode">
                    <h1>Dark / Light</h1>
                    <div class="switch">
                        <div class="knob"></div>
                    </div>
                </div>
                <div class="brightness">
                    <h1>Brightness</h1>
                    <input type = "range" class = "slider">
                    <img src="/assets/brightness.png" alt="Brightness" height = "30px" width = "30px">
                </div>
                <div class="contrast">
                    <h1>Contrast</h1>
                    <input type="range" name="" id="" class = "slider">
                    <img src="/assets/contrast.png" alt="Brightness" height = "30px" width = "30px">
                </div>
                <div class="sepia">
                    <h1>Sepia</h1>
                    <input type="range" name="" id="" class = "slider">
                    <img src="/assets/idea.png" alt="Brightness" height = "30px" width = "30px">
                </div>
                <div class="grayscale">
                    <h1>Grayscale</h1>
                    <input type="range" name="" id="" class = "slider">
                    <img src="/assets/color.png" alt="Brightness" height = "30px" width = "30px">
                </div>
            </div>
        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
